<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — FRAMEHUNT THAILAND</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #e8e2f7, #f8faff 60%, #dcece4);
        color: #243143;
        font-family: "IBM Plex Sans Thai", system-ui, sans-serif;
        padding: 2rem;
      }
      main {
        max-width: 34rem;
        border: 1px solid #fff;
        border-radius: 1.5rem;
        background: #f8faffdc;
        box-shadow: 0 20px 52px -28px #52648680;
        padding: 2rem;
      }
      p.kicker {
        margin: 0;
        font-family: inherit;
        font-size: 0.65rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #315c53;
      }
      h1 {
        margin: 0.75rem 0 0;
        font-size: clamp(2.5rem, 8vw, 4rem);
        line-height: 1.2;
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }
      p.body {
        margin: 1.25rem 0 0;
        color: #526175;
        font-size: 0.9rem;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.7rem 1.1rem;
        border-radius: 0.85rem;
        background: #315c53;
        color: #f8faff;
        font-family: inherit;
        font-size: 0.9rem;
        letter-spacing: normal;
        text-transform: uppercase;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">404 / NOT FOUND</p>
      <h1>หลุดเฟรม</h1>
      <p class="body">ไม่พบหน้าที่คุณเปิด กลับไปค้นหาโลเคชันจากหน้าหลักได้เลย</p>
      <a href="/">กลับหน้าหลัก</a>
    </main>
  </body>
</html>
